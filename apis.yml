name: Swypex
description: >-
  Swypex is an Egyptian fintech, founded in 2022 and headquartered at Smart Village
  in Cairo, that provides an all-in-one financial management platform for businesses.
  The platform bundles corporate cards, payments, invoice management, and working
  capital financing into one system, giving finance teams real-time visibility and
  control over company spend. Swypex launched Egypt's first approval-based corporate
  card, where each transaction's limit unlocks only after real-time review and
  approval by the company's finance team, and offers e-invoicing (with an Odoo
  integration) and Swypextend working-capital financing. Swypex is licensed by the
  Central Bank of Egypt and operates its card program in partnership with Visa and
  Mashreq Bank. It raised a $4M seed round led by Accel (Accel's first fintech
  investment in MENA), with Foundation Ventures and Raba Partnership. Swypex does
  not publish a public developer API; its products are delivered through web and
  mobile apps plus a small set of native integrations (Odoo, e-invoicing, Just2Pay).
